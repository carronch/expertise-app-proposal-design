<text class="ink1" x="32" y="98" font-size="72" font-weight="650">38×</text>
<text class="ink1" x="180" y="62" font-size="22" font-weight="600">₡10,000 → ₡380,000 in nine months</text>
<text class="ink2" x="180" y="88" font-size="15">In 2019, ten 16-year-olds at a rural public high school near the Panama border ran the business.</text>
<text class="ink2" x="180" y="108" font-size="15">Their teacher followed the Ministry of Education guide.</text>
<text class="ink1" x="32" y="161" font-size="14" font-weight="600">Start</text>
<text class="ink3" x="32" y="178" font-size="12">₡1,000 from each of 10 students</text>
