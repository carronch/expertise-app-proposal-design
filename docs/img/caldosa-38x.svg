<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" role="img" aria-labelledby="t d">
<title id="t">From ₡10,000 to ₡380,000: 38 times, in nine months</title>
<desc id="d">In 2019, ten 16-year-old students at Liceo Rural El Progreso, a rural public high school near the Costa Rica–Panama border, each brought ₡1,000 from home (₡10,000 in total). Following the Ministry of Education guide, they made and sold caldosa de montaña, fried plantains topped with shredded beef, first at school and then in their community, held two bingos, and had ₡380,000 in hand nine months later: 38 times what they started with. One square equals ₡10,000; the start row has 1 square and the end row has 38. Only the start and end amounts are documented.</desc>
<style>
  .bg{fill:#fcfcfb}.ink1{fill:#0b0b0b}.ink2{fill:#52514e}.ink3{fill:#898781}
  .mark{fill:#2a78d6}.line{stroke:#c3c2b7}.ring{stroke:#fcfcfb}
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19}.ink1{fill:#ffffff}.ink2{fill:#c3c2b7}.ink3{fill:#898781}
    .mark{fill:#3987e5}.line{stroke:#383835}.ring{stroke:#1a1a19}
  }
</style>
