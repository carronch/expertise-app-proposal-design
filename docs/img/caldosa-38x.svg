<text class="ink2" x="545.0" y="366" font-size="13" text-anchor="middle">bingo</text>
<circle class="mark ring" cx="640.0" cy="318" r="6" stroke-width="2"/>
<text class="ink2" x="640.0" y="348" font-size="13" text-anchor="middle">Grew the</text>
<text class="ink2" x="640.0" y="366" font-size="13" text-anchor="middle">business</text>
<circle class="mark ring" cx="735.0" cy="318" r="6" stroke-width="2"/>
<text class="ink2" x="735.0" y="348" font-size="13" text-anchor="middle">Second</text>
<text class="ink2" x="735.0" y="366" font-size="13" text-anchor="middle">bingo</text>
<circle class="mark ring" cx="830.0" cy="318" r="6" stroke-width="2"/>
<text class="ink1" x="830.0" y="348" font-size="13" text-anchor="middle" font-weight="600">₡380,000</text>
<text class="ink1" x="830.0" y="366" font-size="13" text-anchor="middle" font-weight="600">38×</text>
<text class="ink3" x="32" y="414" font-size="12">Caldosa de montaña: fried plantains with carne mechada (shredded beef) on top.</text>
<text class="ink3" x="32" y="432" font-size="12">Two of the students' families went on to start businesses of their own.</text>
<text class="ink3" x="32" y="462" font-size="11">Sources: Liceos Rurales guides (MEP, 2021); video script, Liceo Rural El Progreso (2023); Daniel Carranza (2026).</text>
