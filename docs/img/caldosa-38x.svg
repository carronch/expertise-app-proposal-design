<text class="ink1" x="70.0" y="348" font-size="13" text-anchor="middle" font-weight="600">₡1,000 each</text>
<text class="ink1" x="70.0" y="366" font-size="13" text-anchor="middle" font-weight="600">from home</text>
<circle class="mark ring" cx="165.0" cy="318" r="6" stroke-width="2"/>
<text class="ink2" x="165.0" y="348" font-size="13" text-anchor="middle">Bought oil</text>
