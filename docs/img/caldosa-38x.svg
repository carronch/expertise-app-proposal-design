<text class="ink3" x="224" y="161" font-size="12" dx="23">₡10,000</text>
<text class="ink3" x="224" y="246" font-size="12">Each square is ₡10,000, the money they started with.</text>
<text class="ink1" x="32" y="290" font-size="14" font-weight="600">How it grew</text>
<text class="ink3" x="124" y="290" font-size="12">Only the first and last amounts are documented.</text>
<line class="line" x1="70" y1="318" x2="830" y2="318" stroke-width="2" stroke-linecap="round"/>
